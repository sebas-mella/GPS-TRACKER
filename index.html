<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker activo</title>
<style>
  body {
    font-family: sans-serif;
    background: #0f1117;
    color: #e8eaf0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    gap: 20px;
    padding: 24px;
    text-align: center;
  }
  .circle {
    width: 120px; height: 120px;
    border-radius: 50%;
    background: #4ade80;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    animation: pulse 2s ease-in-out infinite;
    box-shadow: 0 0 0 0 rgba(74,222,128,0.5);
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
    70% { box-shadow: 0 0 0 20px rgba(74,222,128,0); }
    100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
  }
  h2 { font-size: 20px; font-weight: 600; }
  p { font-size: 14px; color: #6b7280; max-width: 280px; line-height: 1.6; }
  .log {
    background: #181b24;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    font-family: monospace;
    color: #4ade80;
    width: 100%;
    max-width: 320px;
    max-height: 160px;
    overflow-y: auto;
    text-align: left;
  }
  #status { font-size: 14px; color: #4ade80; font-weight: 500; }
</style>
</head>
<body>

<div class="circle">📍</div>
<h2>Compartiendo ubicación</h2>
<div id="status">Iniciando GPS...</div>
<p>Esta página debe mantenerse abierta para compartir la ubicación.</p>

<div class="log" id="log"></div>

<script>
  // ⚠️ CAMBIÁ ESTA URL por la IP de tu servidor
  const SERVIDOR = "http://TU-IP-AQUI:3000";
  const INTERVALO = 30; // segundos

  function log(msg) {
    const el = document.getElementById('log');
    const hora = new Date().toLocaleTimeString('es-AR');
    el.innerHTML = `[${hora}] ${msg}\n` + el.innerHTML;
  }

  async function enviar(lat, lng) {
    try {
      const r = await fetch(`${SERVIDOR}/ubicacion`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lat, lng })
      });
      if (r.ok) {
        document.getElementById('status').textContent = `✓ Enviado: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        log(`Enviado → ${lat.toFixed(5)}, ${lng.toFixed(5)}`);
      }
    } catch {
      log('Sin conexión, reintentando...');
    }
  }

  function obtener() {
    navigator.geolocation.getCurrentPosition(
      pos => enviar(pos.coords.latitude, pos.coords.longitude),
      err => log(`Error GPS: ${err.message}`),
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }

  // Pedir permiso de GPS y arrancar
  if (navigator.geolocation) {
    obtener();
    setInterval(obtener, INTERVALO * 1000);
    log(`Enviando cada ${INTERVALO} segundos...`);
  } else {
    document.getElementById('status').textContent = '❌ GPS no disponible';
  }
</script>
</body>
</html>
